# CI de push/PR — typecheck + testes Rust + o app tem que ABRIR limpo (smoke boot).
# Motivação: a v0.1.120 shippou travando no boot e nada automatizado pegou (spec
# docs/superpowers/specs/2026-07-05-smoke-boot-gate-design.md). O gate de release
# (draft-then-publish, smoke no .deb exato) vive no release.yml — este workflow é o
# feedback CEDO, no push, antes de existir tag.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O license-worker vive fora dos workspaces (services/) e tem lockfile próprio →
  # o `npm ci` da raiz NÃO o instala e nada rodava os testes dele: a suíte ficou
  # meses quebrada (pool-workers da raiz + workerd velho) sem ninguém ver. Job
  # separado e barato, em paralelo ao smoke.
  license-worker:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/license-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # wrangler 4 EXIGE Node >= 22 ("Wrangler requires at least Node.js v22").
          # O job smoke segue no 20 — é o do app, não usa a CLI do wrangler.
          node-version: 22

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes (vitest-pool-workers)
        run: npx vitest run

      # Pega config/binding quebrado sem publicar nada.
      - name: Deploy dry-run
        run: npx wrangler deploy --dry-run

  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Dependências do Linux (WebKitGTK + xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev \
            libfuse3-dev pkg-config xvfb

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Sidecars ANTES do cargo test/tauri build — o build-script do Tauri valida os
      # resources/externalBin já na COMPILAÇÃO (cargo test dispara o build-script), não
      # só no bundle. Num runner limpo os binários não existem → tudo falharia.
      - name: Build OmniCompress sidecar
        shell: bash
        run: bash scripts/build-omnicompress.sh

      - name: Build OmniFS sidecar (Linux)
        shell: bash
        run: bash scripts/build-omnifs-sidecar.sh

      - name: Testes Rust
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build debug (sem bundle)
        working-directory: apps/desktop
        run: npx tauri build --debug --no-bundle

      - name: Smoke self-test (valida a lógica de detecção do gate)
        run: bash scripts/smoke-boot.sh --self-test

      - name: Smoke boot (o app abre limpo?)
        run: bash scripts/smoke-boot.sh apps/desktop/src-tauri/target/debug/omnirift

      # Fluidez do canvas: unit (limiares) + wiring (hooks vivos). Não mede jank
      # real do WebKitGTK — isso continua no smoke visual / benchmark manual.
      - name: Gate de fluidez do canvas (unit + wiring)
        run: bash scripts/canvas-fluency-gate.sh

      # Trava o passivo de lint/clippy/fmt: falha SÓ se piorar em relação à
      # scripts/quality-baseline.txt. O script existia desde a 0.1.141 e nenhum
      # workflow o chamava — baseline que ninguém roda não é gate, é arquivo.
      # Vem por último: não pode mascarar uma falha de build ou de smoke.
      - name: Gate de qualidade (não piorar)
        run: bash scripts/quality-baseline.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # Windows: o buraco que deixou a v0.1.141 e a v0.1.146 shiparem quebradas.
  #
  # Até aqui NENHUM job compilava o alvo Windows. Todo o código `#[cfg(windows)]`
  # — resolução de PATHEXT, wrapper .cmd, quoting do cmd.exe — nunca era sequer
  # COMPILADO no CI, quanto mais testado: os testes viviam sob `#[cfg(windows)]`
  # e o runner era ubuntu. Foi assim que um `build_command` chamado com 2 de 3
  # argumentos ficou meses no repo sem ninguém notar, e que o agente Windows
  # morreu no spawn por 5 versões seguidas.
  #
  # Este job roda a suíte no Windows de verdade. É onde o teste de integração do
  # PTY (spawn de um `.cmd` real) prova o fix no ambiente que importa.
  windows:
    name: Testes no Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Sem `npm ci`/sidecars: o build-script exige os binarios de sidecar e aqui
      # o alvo e a LOGICA (lib), nao o bundle. `--lib` evita compilar o binario
      # Tauri e mantem o job em minutos.
      - name: Testes Rust (lib) no Windows
        run: cargo test --lib --manifest-path apps/desktop/src-tauri/Cargo.toml

      # Formatacao tambem no Windows: o gate de qualidade roda so no Linux e a
      # divergencia de contagem entre os dois ambientes ja custou um PR travado.
      - name: Formatacao
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all --check
